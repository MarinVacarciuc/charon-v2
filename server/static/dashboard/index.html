<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charon · access control</title>
<style>
/* Built for a 1080p screen recording, which drives most of these choices: nothing smaller
   than 13px, high contrast, and state carried by more than colour alone. The previous
   build's console put its most important text at 10-12px in grey - unreadable once the
   recording is scaled, which is the specific mistake this avoids. */
:root{
  --bg:#0b0e14; --panel:#141922; --panel2:#1b2230; --line:#28313f;
  --ink:#e8eef7; --ink-dim:#93a1b5; --ink-faint:#5f6d80;
  --live:#3ddc84; --armed:#5c7a99; --offline:#ff5c5c;
  --grant:#3ddc84; --deny:#ff5c5c; --warn:#ffb02e; --accent:#37c8d4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; gap:24px;
  padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel);
}
.brand{font-size:22px; font-weight:700; letter-spacing:.02em}
.brand span{color:var(--accent)}
.clock{font-variant-numeric:tabular-nums; font-size:20px; color:var(--ink-dim)}
.hcount{margin-left:auto; display:flex; gap:26px; align-items:center}
.stat{text-align:right}
.stat b{display:block; font-size:26px; line-height:1; font-variant-numeric:tabular-nums}
.stat i{font-style:normal; font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em}
.banner{
  display:none; padding:6px 14px; border-radius:6px; font-weight:600;
  background:rgba(255,92,92,.15); color:var(--deny); border:1px solid rgba(255,92,92,.4);
}
.banner.on{display:block}

/* ---------- node strip ---------- */
.strip{display:flex; gap:10px; padding:10px 22px; border-bottom:1px solid var(--line); background:var(--panel2)}
.chip{
  flex:1; display:flex; align-items:center; gap:9px;
  padding:8px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line);
}
.dot{width:10px; height:10px; border-radius:50%; flex:none}
.chip .nm{font-weight:600; font-size:14px}
.chip .st{margin-left:auto; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint)}
/* Three states that must never be confusable: a node with an empty doorway is not a dead one. */
.chip.live   .dot{background:var(--live); box-shadow:0 0 8px var(--live)}
.chip.live   .st{color:var(--live)}
.chip.armed  .dot{background:var(--armed)}
.chip.armed  .st{color:var(--armed)}
.chip.offline{border-color:rgba(255,92,92,.5); background:rgba(255,92,92,.08)}
.chip.offline .dot{background:var(--offline); box-shadow:0 0 8px var(--offline)}
.chip.offline .st{color:var(--offline)}

/* ---------- main split ---------- */
main{flex:1; display:grid; grid-template-columns:62fr 38fr; gap:14px; padding:14px 22px; min-height:0}
.pane{display:flex; flex-direction:column; min-height:0}
.pane > h2{
  margin:0 0 10px; font-size:12px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-faint);
}

/* ---------- zone board ---------- */
.board{flex:1; display:grid; grid-template-columns:repeat(6,1fr); gap:9px; min-height:0}
.col{display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:9px; min-height:0}
.col > header{
  display:block; padding:9px 11px; border:0; border-bottom:1px solid var(--line); background:transparent;
  font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-dim);
}
.col > header b{float:right; color:var(--ink); font-variant-numeric:tabular-nums}
.col.offsite{opacity:.6}
.col.unknownzone header{color:var(--warn)}
.cards{flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:7px}
.card{
  background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--live);
  border-radius:7px; padding:9px 11px; cursor:pointer;
}
.card:hover{border-color:var(--accent)}
.card .who{font-size:16px; font-weight:650; line-height:1.2}
.card .meta{margin-top:3px; font-size:12px; color:var(--ink-dim)}
.card.out{border-left-color:var(--ink-faint)}
.card.flash{animation:landed 1.6s ease-out}
@keyframes landed{
  0%{border-left-color:var(--accent); background:rgba(55,200,212,.22)}
  100%{border-left-color:var(--live); background:var(--panel2)}
}

/* ---------- anomaly feed ---------- */
.feed{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:9px}
.alert{
  border-radius:9px; padding:12px 14px; border:1px solid rgba(255,92,92,.45);
  background:linear-gradient(180deg,rgba(255,92,92,.20),rgba(255,92,92,.09));
  animation:pop .35s ease-out;
}
.alert.warn{border-color:rgba(255,176,46,.45); background:linear-gradient(180deg,rgba(255,176,46,.18),rgba(255,176,46,.07))}
.alert.ok{border-color:rgba(61,220,132,.45); background:linear-gradient(180deg,rgba(61,220,132,.16),rgba(61,220,132,.06))}
.alert .kind{font-size:15px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--deny)}
.alert.warn .kind{color:var(--warn)} .alert.ok .kind{color:var(--grant)}
.alert .body{margin-top:4px; font-size:15px}
.alert .when{margin-top:3px; font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.empty{color:var(--ink-faint); font-size:13px; padding:10px 2px}
@keyframes pop{from{opacity:0; transform:translateY(-7px)} to{opacity:1; transform:none}}

/* ---------- camera tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(6,1fr); gap:9px; padding:0 22px 12px}
.tile{position:relative; aspect-ratio:4/3; background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.tile img{width:100%; height:100%; object-fit:cover; display:block}
.tile .lbl{
  position:absolute; left:0; right:0; bottom:0; padding:5px 8px;
  font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  background:linear-gradient(0deg,rgba(0,0,0,.85),transparent); color:#fff;
}
.tile .rot{
  position:absolute; top:6px; right:6px; z-index:2;
  width:26px; height:26px; line-height:24px; text-align:center; padding:0;
  font-size:15px; border-radius:6px; opacity:0; transition:opacity .15s;
  background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.25); color:#fff;
}
.tile:hover .rot{opacity:1}
.tile .rot b{position:absolute; left:0; right:0; bottom:-14px; font-size:9px; color:var(--ink-faint); font-weight:600}
.tile .ph{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:4px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
}

/* ---------- face boxes ----------
   Green means the system committed to a name, red means it did not. Colour alone never
   carries it: the caption under every box says which, so the distinction survives a
   greyscale print and a red-green colour deficiency. 3px because the previous build's
   hairline rectangles disappeared entirely once a 1080p recording was scaled down. */
.tile .fx{position:absolute; inset:0; pointer-events:none; z-index:1}
.face{
  position:absolute; border:3px solid var(--deny); border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6);
}
.face.known{border-color:var(--grant)}
.face .tag{
  position:absolute; left:50%; top:100%; transform:translateX(-50%);
  margin-top:3px; padding:2px 7px; border-radius:4px; white-space:nowrap;
  font-size:11px; font-weight:800; line-height:1.4; background:var(--deny); color:#2a0000;
}
.face.known .tag{background:var(--grant); color:#03210f}
/* A face at the bottom of the frame would push its caption past the tile, which clips it -
   the name would simply not be there, on exactly the close-up shots that matter most. When
   there is no room below, it goes inside the box instead of nowhere. */
.face.low .tag{top:auto; bottom:3px; margin-top:0}
.tile.armed   .ph{color:var(--armed); background:#0c1119}
.tile.offline .ph{color:var(--offline); background:rgba(255,92,92,.08)}
.tile.live    .ph{display:none}
.tile.live img,.tile.armed img,.tile.offline img{opacity:1}
.tile.armed img,.tile.offline img{display:none}

/* ---------- person popover ----------
   Anchored to the card rather than shown as a modal, and with no backdrop, because closing it
   means clicking the same name again - a backdrop would swallow that click. */
.pop{
  position:fixed; z-index:60; width:320px; max-width:calc(100vw - 20px);
  background:var(--panel); border:1px solid var(--line); border-radius:11px;
  box-shadow:0 20px 50px rgba(0,0,0,.65); display:none;
}
.pop.on{display:block}
.pop .ph{
  display:flex; align-items:flex-start; gap:10px;
  padding:12px 14px; border-bottom:1px solid var(--line);
}
.pop .ph .nm{font-size:17px; font-weight:700; line-height:1.2}
.pop .ph .sub{margin-top:2px; font-size:12px; color:var(--ink-dim)}
.pop .x{
  margin-left:auto; flex:none; width:26px; height:26px; padding:0; line-height:1;
  font-size:17px; border-radius:6px;
}
.pop .sec{padding:11px 14px; border-bottom:1px solid var(--line)}
.pop .sec:last-child{border-bottom:0}
.pop .sec h4{
  margin:0 0 7px; font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-faint);
}
.pop .row{display:flex; align-items:center; gap:8px; margin-bottom:7px}
.pop .row:last-child{margin-bottom:0}
.pop .grow{flex:1; min-width:0}
.pop select,.pop input{
  font:inherit; font-size:13px; padding:6px 8px; border-radius:6px;
  background:var(--panel2); color:var(--ink); border:1px solid var(--line);
}
.pop input{width:62px}
.pop button{font-size:13px; padding:6px 11px}
.pop button.danger{background:rgba(255,92,92,.16); border-color:rgba(255,92,92,.5); color:#ffd7d7}
.pop .grant{
  display:flex; align-items:center; gap:8px; padding:6px 9px; margin-bottom:6px;
  background:var(--panel2); border:1px solid var(--line); border-radius:7px; font-size:13px;
}
.pop .grant .zn{font-weight:650}
.pop .grant .ttl{margin-left:auto; color:var(--ink-dim); font-variant-numeric:tabular-nums; font-size:12px}
.pop .grant button{padding:3px 8px; font-size:12px}
.pop .none{font-size:13px; color:var(--ink-faint)}
.pop .msg{font-size:12px; color:var(--warn); margin-top:7px}

/* ---------- footer ---------- */
footer{
  display:flex; align-items:center; gap:16px;
  padding:9px 22px; border-top:1px solid var(--line); background:var(--panel);
}
.trail{flex:1; min-width:0; font-size:12px; color:var(--ink-dim); font-variant-numeric:tabular-nums;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
button{
  font:inherit; font-weight:650; padding:8px 15px; border-radius:7px; cursor:pointer;
  background:var(--panel2); color:var(--ink); border:1px solid var(--line);
}
button:hover{border-color:var(--accent)}
button.arm{background:rgba(255,92,92,.18); border-color:rgba(255,92,92,.55); color:#ffd7d7}

/* ---------- mobile ----------
   The layout above is built for a 1080p recording and assumes a fixed viewport height with
   panes scrolling internally - correct for that screen, wrong for a phone. docs/FIELD_DAY.md
   explicitly has an operator open this on their phone to check node health while walking the
   yard, so this is a real, load-bearing use case rather than a nice-to-have. Below the
   breakpoint the page becomes a normal scrolling page: one column, natural height, nothing
   forced narrower than its content (which is what caused the horizontal scroll - a flex/grid
   item's default min-width is its content size, not 0). */
@media (max-width: 860px){
  body{overflow:auto; height:auto; min-height:100%}
  header{flex-wrap:wrap; gap:10px 20px}
  .hcount{gap:16px}
  .strip{flex-wrap:wrap}
  .chip{flex:1 1 100%; min-width:0}
  main{display:block; padding:14px 14px; overflow:visible}
  .pane{margin-bottom:16px}
  .board{display:block}
  .col{margin-bottom:10px; min-height:0}
  .col .cards{overflow-y:visible; max-height:none}
  .feed{overflow-y:visible}
  .tiles{grid-template-columns:repeat(2,1fr); padding:0 14px 12px}
  footer{flex-wrap:wrap}
  .trail{white-space:normal; flex-basis:100%}
}
</style>

<header>
  <div class="brand">CHARON<span> · access control</span></div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="banner" id="banner"></div>
  <div class="hcount">
    <div class="stat"><b id="n-onsite">0</b><i>on site</i></div>
    <div class="stat"><b id="n-live">0</b><i>cameras live</i></div>
    <div class="stat"><b id="n-alerts">0</b><i>alerts</i></div>
  </div>
</header>

<div class="strip" id="strip"></div>

<main>
  <section class="pane">
    <h2>On site by zone</h2>
    <div class="board" id="board"></div>
  </section>
  <section class="pane">
    <h2>Anomalies</h2>
    <div class="feed" id="feed"><div class="empty">Nothing flagged yet.</div></div>
  </section>
</main>

<div class="tiles" id="tiles"></div>

<div class="pop" id="pop"></div>

<footer>
  <div class="trail" id="trail">audit trail</div>
  <button id="reset">Reset take</button>
</footer>

<script>

/* ---------------- admin token ----------------
   Mutating routes need a shared secret (threat model A7). Asked for once, kept in
   localStorage, sent in a header rather than a query string so it stays out of server logs
   and browser history. Read-only routes never need it, so the board and the tiles keep
   working untouched even if the token is wrong or absent. */
const TOKEN_KEY = "charon.admin";
// The server itself skips the token for requests from 127.0.0.1 (see app/api/auth.py) - so
// when this page was opened that way, there is nothing to ask for. This is what makes
// enrolling from the Mac one click, per Marin's ask 2026-09-07: no prompt in the way.
const ON_LOOPBACK = location.hostname === "127.0.0.1" || location.hostname === "localhost";
function adminToken(force){
  if(ON_LOOPBACK) return "";
  let t = force ? null : localStorage.getItem(TOKEN_KEY);
  if(!t){
    t = prompt("Admin token (from server/.env)") || "";
    if(t) localStorage.setItem(TOKEN_KEY, t);
  }
  return t;
}
async function adminFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {"X-Charon-Admin": adminToken(false)});
  let r = await fetch(url, opts);
  if(r.status === 401){
    // Wrong or stale token: ask once more, then give up rather than looping.
    opts.headers["X-Charon-Admin"] = adminToken(true);
    r = await fetch(url, opts);
    if(r.status === 401) alert("Admin token rejected.");
  }
  return r;
}

const NODES = [
  {id:"gate-in",        label:"ENTRY · gate-in"},
  {id:"gate-out",       label:"EXIT · gate-out"},
  {id:"zone-reception", label:"Reception"},
  {id:"zone-warehouse", label:"Warehouse"},
  {id:"zone-workshop",  label:"Workshop"},
  {id:"zone-server",    label:"Server room"},
];
// Column order is fixed and includes two synthetic columns: someone who has entered but has
// not yet been placed by a zone camera (at_zone is deliberately left empty on entry), and
// everyone off site.
const COLUMNS = ["Reception","Warehouse","Workshop","Server room","__unplaced","__offsite"];
const COLUMN_LABEL = {"__unplaced":"On site · zone unknown","__offsite":"Off site"};

const ALERT_TONE = {  // which alerts are red, which are merely amber
  wrong_zone:"", unknown_in_zone:"", denied_crossed:"", unidentified_passage:"",
  concurrent_entry:"", exit_without_entry:"", tailgating:"warn", node_status:"warn",
};
const ALERT_TITLE = {
  wrong_zone:"Wrong zone", unknown_in_zone:"Unknown face", denied_crossed:"Denied but crossed",
  unidentified_passage:"Unidentified passage", concurrent_entry:"Concurrent entry",
  exit_without_entry:"Exit without entry", tailgating:"Possible tailgating",
  gate_decision:"Gate", node_offline:"Node offline",
};

let people = [], nodes = [], alertCount = 0;

const $ = s => document.querySelector(s);
const hhmmss = d => d.toTimeString().slice(0,8);
// Names and roles are typed by an admin and then written into innerHTML in several places
// here, which is an injection route however trusted the typist is.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function tick(){ $("#clock").textContent = hhmmss(new Date()); }
setInterval(tick, 1000); tick();

/* ---------------- node strip + tiles ---------------- */
function renderStrip(){
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  $("#strip").innerHTML = NODES.map(n=>{
    const s = byId[n.id];
    const state = s ? s.state : "offline";
    // "armed" no longer means the camera is off - it stays on now - it means nobody is
    // inside recognition range, so the brain is not asking this node for frames.
    const text = state==="live" ? "live" : state==="armed" ? "armed · nobody in range" : "offline";
    return `<div class="chip ${state}"><span class="dot"></span>
            <span class="nm">${n.id}</span><span class="st">${text}</span></div>`;
  }).join("");
  const live = nodes.filter(n=>n.state==="live").length;
  $("#n-live").textContent = live;
  const off = nodes.filter(n=>n.state==="offline");
  const b = $("#banner");
  if(off.length){ b.className="banner on"; b.textContent = `${off.length} node(s) offline: ${off.map(n=>n.id).join(", ")}`; }
  else b.className = "banner";
}

function buildTiles(){
  $("#tiles").innerHTML = NODES.map(n=>`
    <div class="tile offline" id="tile-${n.id}">
      <img id="img-${n.id}" alt="">
      <div class="fx" id="fx-${n.id}"></div>
      <div class="ph"><span id="ph-${n.id}">offline</span></div>
      <button class="rot" data-node="${n.id}" title="Rotate this camera 90&deg;">&#8635;</button>
      <div class="lbl">${n.label}</div>
    </div>`).join("");
  // Orientation is a property of how THIS camera was mounted, so it is corrected on the tile
  // where the problem is visible, and only for that node (REBUILD_PROMPT §0.6.9).
  document.querySelectorAll(".rot").forEach(btn=>{
    btn.onclick = async () => {
      const id = btn.dataset.node;
      const cur = (nodes.find(n=>n.id===id) || {}).rotation_deg || 0;
      const next = (cur + 90) % 360;
      await adminFetch(`/nodes/${id}/rotation?deg=${next}`, {method:"POST"});
      loadNodes();
    };
  });
  NODES.forEach(n=>pump(n.id));
}
// One chained request per tile, and each tile is pinned to its own node for life: the old
// build had a single preview element that silently swapped between two physical cameras,
// which reads as "the video is glitching" (REBUILD_PROMPT §0.6.4).
// Fetched rather than assigned straight to img.src, because the face boxes ride on a response
// header (X-Faces) and an <img> never exposes its headers. That coupling is the point: boxes
// and pixels arrive in one response, so a rectangle can never be drawn over a different frame
// than the one it was measured on.
function pump(id){
  const img = document.getElementById("img-"+id);
  const layer = document.getElementById("fx-"+id);
  let shown = null;                       // object URL currently on screen, revoked once replaced
  const again = ms => setTimeout(next, ms);
  const next = async () => {
    const n = nodes.find(x=>x.id===id);
    if(!n || n.state!=="live"){ layer.innerHTML = ""; return again(700); }
    let r;
    try{ r = await fetch(`/frame.jpg?node=${id}&t=${Date.now()}`); }catch(e){ return again(700); }
    if(!r.ok) return again(700);
    let faces = [];
    try{ faces = JSON.parse(r.headers.get("X-Faces") || "[]"); }catch(e){}
    const url = URL.createObjectURL(await r.blob());
    img.onload = () => {
      if(shown) URL.revokeObjectURL(shown);
      shown = url;
      drawFaces(id, faces);
      again(90);
    };
    img.onerror = () => { URL.revokeObjectURL(url); again(700); };
    img.src = url;
  };
  next();
}

function drawFaces(id, faces){
  const img = document.getElementById("img-"+id);
  const layer = document.getElementById("fx-"+id);
  if(!img.naturalWidth || !faces.length){ layer.innerHTML = ""; return; }
  // The tile crops with object-fit:cover, so the overlay has to repeat that same maths:
  // scale to fill the short side, then centre the overflow. Reading it off the rendered
  // element instead means every box lands off the face the moment a camera is rotated.
  const cw = img.clientWidth, ch = img.clientHeight;
  const s = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
  const ox = (cw - img.naturalWidth * s) / 2, oy = (ch - img.naturalHeight * s) / 2;
  const TAG_H = 20;   // caption height plus its gap, in tile pixels
  layer.innerHTML = faces.map(f => {
    const known = f.confident && f.person_id != null;
    const p = known ? people.find(q => q.id === f.person_id) : null;
    const name = known ? (p ? p.name : "person " + f.person_id) : "Unknown";
    const top = oy + f.y * s, h = f.h * s;
    const low = top + h + TAG_H > ch;
    return `<div class="face ${known ? "known" : "unknown"}${low ? " low" : ""}"
              style="left:${ox + f.x * s}px; top:${top}px; width:${f.w * s}px; height:${h}px">
              <span class="tag">${esc(name)}</span></div>`;
  }).join("");
}
function syncTiles(){
  nodes.forEach(n=>{
    const t = document.getElementById("tile-"+n.id);
    if(!t) return;
    t.className = "tile " + n.state;
    const ph = document.getElementById("ph-"+n.id);
    if(ph) ph.textContent = n.state==="armed" ? "armed · nobody in range" : "offline";
    // The picture is hidden below, so its boxes must go with it rather than hang over a
    // placeholder that says nobody is there.
    if(n.state !== "live"){ const fx = document.getElementById("fx-"+n.id); if(fx) fx.innerHTML = ""; }
  });
}

/* ---------------- zone board with FLIP ---------------- */
function columnOf(p){
  if(p.presence !== "in") return "__offsite";
  return p.zone_name || "__unplaced";
}
function measure(){
  const m = new Map();
  document.querySelectorAll(".card[data-pid]").forEach(el=>{
    m.set(el.dataset.pid, el.getBoundingClientRect());
  });
  return m;
}
function renderBoard(prev){
  const groups = Object.fromEntries(COLUMNS.map(c=>[c,[]]));
  people.forEach(p=>groups[columnOf(p)].push(p));

  $("#board").innerHTML = COLUMNS.map(c=>{
    const label = COLUMN_LABEL[c] || c;
    const cls = c==="__offsite" ? "col offsite" : c==="__unplaced" ? "col unknownzone" : "col";
    const cards = groups[c].map(p=>`
      <div class="card ${p.presence==="in"?"":"out"}" data-pid="${p.id}">
        <div class="who">${esc(p.name)}</div>
        <div class="meta">${esc(p.role_name)}${p.presence==="in"&&p.entry_time?" · since "+p.entry_time.slice(11,16):""}</div>
      </div>`).join("");
    return `<div class="${cls}"><header>${label}<b>${groups[c].length}</b></header>
            <div class="cards">${cards}</div></div>`;
  }).join("");

  // The board is rebuilt wholesale, so an open popover's anchor was just destroyed and
  // replaced. Re-anchor it rather than leaving it pointing at nothing while its subject
  // slides to another column.
  placePop();

  if(!prev) return;
  // FLIP: cards that changed column animate from where they were to where they are now, so a
  // move is legible on a recording. The old board replaced its innerHTML wholesale and a
  // person simply vanished from one column and appeared in another between frames.
  document.querySelectorAll(".card[data-pid]").forEach(el=>{
    const before = prev.get(el.dataset.pid);
    if(!before) return;
    const after = el.getBoundingClientRect();
    const dx = before.left - after.left, dy = before.top - after.top;
    if(Math.abs(dx) < 2 && Math.abs(dy) < 2) return;
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>{
      el.style.transition = "transform .5s cubic-bezier(.22,.7,.2,1)";
      el.style.transform = "";
      el.classList.add("flash");
    });
  });
}

/* ---------------- person popover ----------------
   One click on a name opens it, a second on the same name closes it, and so does the cross.
   Everything it offers is per-person and reversible: annul the session credential, hand out a
   just-in-time zone pass, take one back. */
let openPid = null, popAnchor = null;

function closePop(){ openPid = null; popAnchor = null; $("#pop").className = "pop"; }

function placePop(){
  const pop = $("#pop");
  if(openPid === null) return;
  const card = document.querySelector(`.card[data-pid="${openPid}"]`);
  if(card) popAnchor = card;
  if(!popAnchor) return;
  const a = popAnchor.getBoundingClientRect(), p = pop.getBoundingClientRect();
  const pad = 10;
  let left = a.right + 8;
  if(left + p.width > innerWidth - pad) left = a.left - p.width - 8;   // flip to the other side
  if(left < pad) left = pad;                                           // and give up gracefully
  let top = a.top;
  if(top + p.height > innerHeight - pad) top = innerHeight - p.height - pad;
  if(top < pad) top = pad;
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

function minutesLeft(expires_at){
  // Stored UTC without a zone marker, so say so explicitly rather than letting the browser
  // read it as local time and report an hour of access that does not exist.
  const ms = new Date(expires_at.replace(" ", "T") + "Z") - new Date();
  return Math.round(ms / 60000);
}

async function renderPop(){
  const pop = $("#pop");
  if(openPid === null) return;
  let data;
  try{ data = await (await fetch("/people/roster")).json(); }
  catch(e){ pop.innerHTML = `<div class="sec"><div class="none">Could not reach the server.</div></div>`; return; }
  const p = (data.people || []).find(q => q.id === openPid);
  if(!p){ closePop(); return; }

  const onSite = p.presence === "in";
  const grants = (p.grants || []).map(g => {
    const m = minutesLeft(g.expires_at);
    return `<div class="grant"><span class="zn">${esc(g.zone)}</span>
              <span class="ttl">${m > 0 ? m + " min left" : "lapsed"}</span>
              <button data-ungrant="${esc(g.zone)}">Revoke</button></div>`;
  }).join("");

  pop.innerHTML = `
    <div class="ph">
      <div class="grow">
        <div class="nm">${esc(p.name)}</div>
        <div class="sub">${esc(p.role_name)} · ${onSite ? "on site" : "off site"}${
          onSite && p.zone_name ? " · " + esc(p.zone_name) : ""}${
          onSite && p.entry_time ? " · since " + esc(p.entry_time.slice(11,16)) : ""}</div>
      </div>
      <button class="x" title="Close">&times;</button>
    </div>
    <div class="sec">
      <h4>Session</h4>
      <div class="row">
        <span class="grow">${p.has_token ? "Token issued at entry" : "No live token"}</span>
        <button class="danger" id="pop-revoke" ${p.has_token ? "" : "disabled"}>Revoke</button>
      </div>
      <div class="none">Revoking voids the credential. It does not record them as having left.</div>
    </div>
    <div class="sec">
      <h4>Temporary zone access</h4>
      ${grants || `<div class="none">No temporary passes.</div>`}
      <div class="row" style="margin-top:9px">
        <select id="pop-zone" class="grow">
          ${(data.zones || []).map(z => `<option value="${esc(z)}">${esc(z)}</option>`).join("")}
        </select>
        <input id="pop-mins" type="number" min="1" max="1440" value="15" title="Minutes">
        <button id="pop-grant">Grant</button>
      </div>
      <div class="none">Passes lapse on their own; nobody has to remember to take them back.</div>
      <div class="msg" id="pop-msg"></div>
    </div>`;

  pop.querySelector(".x").onclick = closePop;
  const msg = t => { const m = pop.querySelector("#pop-msg"); if(m) m.textContent = t; };

  pop.querySelector("#pop-revoke").onclick = async () => {
    const r = await adminFetch(`/people/${openPid}/revoke-token`, {method:"POST"});
    if(!r.ok) return msg("Could not revoke the token.");
    await renderPop(); placePop(); loadPeople(false); loadTrail();
  };
  pop.querySelector("#pop-grant").onclick = async () => {
    const zone = pop.querySelector("#pop-zone").value;
    const mins = parseInt(pop.querySelector("#pop-mins").value, 10);
    if(!(mins >= 1 && mins <= 1440)) return msg("Minutes must be between 1 and 1440.");
    const r = await adminFetch(`/people/${openPid}/grant?zone=${encodeURIComponent(zone)}&minutes=${mins}`,
                               {method:"POST"});
    if(!r.ok) return msg("Could not issue the pass.");
    await renderPop(); placePop(); loadTrail();
  };
  pop.querySelectorAll("[data-ungrant]").forEach(b => {
    b.onclick = async () => {
      const r = await adminFetch(
        `/people/${openPid}/grant?zone=${encodeURIComponent(b.dataset.ungrant)}`, {method:"DELETE"});
      if(!r.ok) return msg("Could not revoke the pass.");
      await renderPop(); placePop(); loadTrail();
    };
  });
}

async function togglePop(pid){
  if(openPid === pid){ closePop(); return; }
  openPid = pid;
  const pop = $("#pop");
  pop.className = "pop on";
  pop.innerHTML = `<div class="sec"><div class="none">Loading…</div></div>`;
  placePop();
  await renderPop();
  placePop();
}

// Delegated, because renderBoard replaces the whole board every few seconds and any handler
// bound to a card would be thrown away with it.
$("#board").addEventListener("click", ev => {
  const card = ev.target.closest(".card[data-pid]");
  if(card) togglePop(parseInt(card.dataset.pid, 10));
});
addEventListener("keydown", ev => { if(ev.key === "Escape") closePop(); });
addEventListener("resize", placePop);

/* ---------------- anomaly feed ---------------- */
function pushAlert(kind, body){
  const feed = $("#feed");
  if(feed.querySelector(".empty")) feed.innerHTML = "";
  const el = document.createElement("div");
  el.className = "alert " + (ALERT_TONE[kind] ?? "");
  el.innerHTML = `<div class="kind">${ALERT_TITLE[kind] || kind.replace(/_/g," ")}</div>
                  <div class="body">${body}</div>
                  <div class="when">${hhmmss(new Date())}</div>`;
  feed.prepend(el);
  while(feed.children.length > 6) feed.lastChild.remove();
  $("#n-alerts").textContent = ++alertCount;
}

/* ---------------- data ---------------- */
async function loadNodes(){
  try{
    nodes = (await (await fetch("/nodes")).json()).nodes;
    renderStrip(); syncTiles();
  }catch(e){}
}
async function loadPeople(animate){
  try{
    const prev = animate ? measure() : null;
    people = (await (await fetch("/people")).json()).people;
    $("#n-onsite").textContent = people.filter(p=>p.presence==="in").length;
    renderBoard(prev);
  }catch(e){}
}
async function loadTrail(){
  try{
    const rows = (await (await fetch("/audit?limit=3")).json()).entries;
    $("#trail").textContent = rows.map(r=>`${r.ts.slice(11,19)} ${r.message}`).join("   ·   ") || "audit trail";
  }catch(e){}
}

/* ---------------- live stream ---------------- */
function connect(){
  const es = new EventSource("/events");
  es.onmessage = ev => {
    let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
    if(d.type === "node_status"){ loadNodes(); if(d.zone_person) loadPeople(true); }
    else if(d.type === "passage"){ loadPeople(true); loadTrail(); }
    else if(d.type === "reset"){ loadPeople(true); loadTrail(); $("#feed").innerHTML='<div class="empty">Nothing flagged yet.</div>'; alertCount=0; $("#n-alerts").textContent=0; }
    else if(d.type === "alert"){
      if(d.kind === "gate_decision"){
        const el = document.createElement("div");
        const feed = $("#feed");
        if(feed.querySelector(".empty")) feed.innerHTML = "";
        el.className = "alert " + (d.granted ? "ok" : "");
        el.innerHTML = `<div class="kind">${d.granted?"Granted":"Denied"}</div>
                        <div class="body">${d.message}</div>
                        <div class="when">${hhmmss(new Date())}</div>`;
        feed.prepend(el);
        while(feed.children.length > 6) feed.lastChild.remove();
      } else {
        pushAlert(d.kind, d.message);
      }
      loadPeople(true); loadTrail();
    }
  };
  es.onerror = () => {};  // EventSource reconnects on its own - that is why this is SSE
}

/* ---------------- reset (two-click arm, no native confirm) ---------------- */
let armed = false, armTimer = null;
$("#reset").onclick = async () => {
  const b = $("#reset");
  if(!armed){
    armed = true; b.classList.add("arm"); b.textContent = "Click again to reset";
    armTimer = setTimeout(()=>{ armed=false; b.classList.remove("arm"); b.textContent="Reset take"; }, 4000);
    return;
  }
  clearTimeout(armTimer); armed = false;
  b.classList.remove("arm"); b.textContent = "Reset take";
  await adminFetch("/reset", {method:"POST"});
};

buildTiles();
loadNodes(); loadPeople(false); loadTrail();
setInterval(loadNodes, 2000);
setInterval(()=>loadPeople(true), 5000);   // animate here too: the FLIP pass no-ops when nothing moved,
                                          // so the safety-net poll stays as legible as an SSE-driven update
setInterval(loadTrail, 5000);
connect();
</script>
